    <!-- Aggiunta essenziale per la Dark Mode: applica il tema salvato prima di caricare la pagina -->
    <script>
        const savedTheme = localStorage.getItem('theme');

            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="stylesheet" href="style/style.css">
    
    <!-- Controllo dello stato di manutenzione -->
    <script>
        if (localStorage.getItem('site_maintenance') === 'true') {

        }
    </script>

        </nav>
        <!-- Aggiunto lo stesso stile in linea del bottone della Home per pareggiare le dimensioni -->
