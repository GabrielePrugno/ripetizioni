<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota un Appuntamento</title>
    
    <!-- Aggiunta essenziale per la Dark Mode: applica il tema salvato prima di caricare la pagina -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <link rel="stylesheet" href="style/style.css">
    
    <!-- Controllo dello stato di manutenzione -->
    <script>
        if (localStorage.getItem('site_maintenance') === 'true') {
            window.location.href = 'maintenance.html';
        }
    </script>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">GABRIELE PRUGNO</a></div>
        
        <!-- Aggiunto id="nav-menu" -->
        <nav class="nav-links" id="nav-menu">
            <a href="me.html">CHI SONO IO?</a>
        </nav>
        
        <!-- Contenitore per i due bottoni a destra -->
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            
            <!-- Tasto Hamburger (Nuovo) -->
            <button id="hamburger-btn" class="btn-outline-sm hamburger-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>

            <!-- Tasto Luna (o Tasto Casetta nelle altre pagine) -->
            <button id="theme-toggle" class="btn-outline-sm" style="cursor: pointer; background: transparent; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            </button>
            
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        
        <!-- Booking Header Section -->
        <section class="hero-section" style="padding-bottom: 2rem; grid-template-columns: 1fr;">
            <div class="hero-content">
                <span class="section-tag">&mdash; PRENOTAZIONE ONLINE</span>
                <h1 class="hero-title">Fissa un appuntamento.</h1>
                <p class="hero-subtitle">
                    Seleziona la data e l'orario più comodi per te direttamente dal calendario sottostante. Riceverai una conferma immediata via email.
                </p>
            </div>
        </section>

        <!-- Google Calendar Embed Container -->
        <section class="booking-calendar-section">
            <div class="calendar-embed-frame">
                <!-- Google Calendar Appointment Scheduling begin -->
                <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2pSFNQS7HlMXKCCh6ACoEn0Q-ZIsM1eIbjxJtRkHIQAtX1nQZTLDccXStNKVUGUmn6h_0moEcF?gv=true" style="border: 0" width="100%" height="600" frameborder="0"></iframe>
                <!-- end Google Calendar Appointment Scheduling -->
            </div>
        </section>

        <hr class="divider">

    </main>

    <!-- Footer -->
    <footer class="footer-bar">
        <span>&copy; 2026 GABRIELE PRUGNO</span>
        <!-- Corretto il tag a -->
        <span><a class="admin-link"></a>ITALIA</span>
    </footer>

</body>
</html>
