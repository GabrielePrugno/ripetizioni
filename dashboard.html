<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gestione - Gabriele Prugno</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header>
        <h1>Pannello di Controllo</h1>
        <p>Gestione Generale del Sito</p>
    </header>

    <main>
        <div class="dashboard-card">
            <h3>Stato del Sito</h3>
            <p>Seleziona la modalità di funzionamento attiva per i visitatori:</p>

            <div class="toggle-container">
                <label class="switch">
                    <input type="checkbox" id="maintenanceToggle" onchange="toggleMaintenance()">
                    <span class="slider round"></span>
                </label>
                <span id="statusLabel" class="status-badge active">Sito Attivo</span>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" class="link-back">&larr; Torna al Sito Pubblico</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Pannello di Amministrazione Riservato</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isMaintenance = localStorage.getItem('site_maintenance') === 'true';
            const toggle = document.getElementById('maintenanceToggle');
            toggle.checked = isMaintenance;
            updateStatusLabel(isMaintenance);
        });

        function toggleMaintenance() {
            const toggle = document.getElementById('maintenanceToggle');
            localStorage.setItem('site_maintenance', toggle.checked);
            updateStatusLabel(toggle.checked);
        }

        function updateStatusLabel(isMaintenance) {
            const label = document.getElementById('statusLabel');
            if (isMaintenance) {
                label.textContent = "Modalità Manutenzione Attiva";
                label.className = "status-badge maintenance";
            } else {
                label.textContent = "Sito Attivo Online";
                label.className = "status-badge active";
            }
        }
    </script>

</body>
</html>
